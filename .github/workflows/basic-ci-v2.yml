# .github/workflows/basic-ci-v2.yml
name: Basic CI V2 Pipeline
 
on:
  workflow_dispatch: 

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
 
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        # No cache until we have lock files

    - name: Initialize project if needed
      run: |
        if [ ! -f package.json ]; then
          echo "Creating package.json..."
          cat > package.json << EOF
        {
          "name": "gittest",
          "version": "1.0.0",
          "description": "GitHub Actions test project",
          "main": "index.js",
          "scripts": {
            "start": "node index.js",
            "test": "node test.js",
            "build": "echo 'Build completed successfully'"
          },
          "dependencies": {
            "express": "^4.18.2"
          },
          "devDependencies": {
            "jest": "^29.7.0"
          }
        }
        EOF
        fi

    - name: Create basic application files
      run: |
        # Create index.js
        cat > index.js << 'EOF'
        const express = require('express');
        const app = express();
        const port = 3000;

        app.get('/', (req, res) => {
          res.json({ 
            message: 'Hello from GitHub Actions!',
            timestamp: new Date().toISOString()
          });
        });

        console.log(`Server would run on port ${port}`);
        console.log('Application started successfully!');
        EOF

        # Create test.js
        cat > test.js << 'EOF'
        console.log('Running tests...');
        console.log('✅ All tests passed!');
        EOF

    - name: Install dependencies
      run: npm install

    - name: Run build
      run: npm run build

    - name: Run tests
      run: npm test

    - name: Start application (test)
      run: |
        timeout 5s npm start || echo "Application test completed"

    - name: Show final project structure
      run: |
        echo "=== Project files ==="
        ls -la
        echo "=== Dependencies installed ==="
        npm list --depth=0
