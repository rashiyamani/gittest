# .github/workflows/basic-ci.yml
name: Basic CI v2 Pipeline
 
on:
  workflow_dispatch: 

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
 
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Create package.json
      run: |
        cat > package.json << EOF
        {
          "name": "gittest",
          "version": "1.0.0",
          "description": "GitHub Actions test",
          "main": "index.js",
          "scripts": {
            "start": "node index.js",
            "test": "echo '✅ No tests specified - this is OK for now'",
            "build": "echo '🔨 Build completed successfully'"
          }
        }
        EOF

    - name: Create index.js
      run: |
        echo 'console.log("Hello from Node.js!");' > index.js

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test  # This will now pass

    - name: Run build
      run: npm run build

    - name: Run application
      run: npm start
