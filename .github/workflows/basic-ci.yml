# .github/workflows/basic-ci.yml
name: Basic CI Pipeline
 
on:
  workflow_dispatch: 

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create package.json
      run: |
        echo "Creating package.json..."
        #       npm init -y
        npm install --package-lock-only

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
    - name: Install some example dependencies
      run: |
        npm install express
        npm install --save-dev jest
        
    - name: Show created files
      run: |
        echo "=== Created package.json ==="
        cat package.json
        echo "=== Created package-lock.json ==="
        ls -la package-lock.json

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: javascript
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

      
    - name: Create build files
      run: |
        mkdir -p dist
        echo "console.log('Built application');" > dist/app.js
        echo "Built on $(date)" > dist/build-info.txt
        echo '{"version": "1.0.0", "built": "'$(date)'"}' > dist/manifest.json

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-files
        path: dist/
